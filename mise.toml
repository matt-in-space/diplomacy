[tools]
go = "1.26.4"
node = "22"

[tasks."frontend:test"]
description = "Run the frontend's JS test suite"
run = "node --test \"web/static/js/_tests/**/*.test.mjs\""
sources = ["web/static/js/**/*.mjs"]

[tasks.dev]
description = "Run the dev server (with seeded dev accounts, reading templates/static assets from disk)"
run = "go run ./cmd/server -seed -dev"
