<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Diplomacy</title>
	<link rel="stylesheet" href="/static/game.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
</head>
<body>
	<div class="game-layout">
		<div class="map-area">
			<div id="app" data-game-id="{{.GameID}}" data-map-id="{{.MapID}}"></div>
			<!-- Real data, filled in by sidebarRender.mjs once main.mjs's
			     first game.onUpdate fires — see docs/game-ui.md. Lives
			     outside #app: main.mjs replaces #app's whole content while
			     the map loads, which would wipe anything placed inside it.
			     Placeholder text below is neutral ("Loading…"), not
			     specific fake data — real game state briefly flashing stale
			     invented values would be actively misleading. -->
			<div class="turn-status">
				<div class="turn">Loading…</div>
				<div class="phase"></div>
			</div>
		</div>
		<aside class="sidebar">
			<section>
				<h2>Nations</h2>
				<ul class="nation-list"></ul>
			</section>
			<section>
				<h2 class="unit-list-heading">Your Units</h2>
				<ul class="unit-list"></ul>
			</section>
		</aside>
	</div>
	<p class="map-credit">Map based on
		<a href="https://commons.wikimedia.org/wiki/File:Diplomacy.svg">File:Diplomacy.svg</a>
		by Martin Asal,
		<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>.
	</p>
	<script type="module" src="/static/js/main.mjs"></script>
</body>
</html>
